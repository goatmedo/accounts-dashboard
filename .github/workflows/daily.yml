name: Daily refresh

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC = 9:00 Riyadh
  workflow_dispatch:       # "Run workflow" button
  push:
    branches: [main]
    paths-ignore: ['data/**']

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect numbers
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BROWSER_PATH: /usr/bin/google-chrome
          BROWSER_PROFILE: ${{ runner.temp }}/browser-profile
        run: |
          node collect.mjs
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat data/status.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Save data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Daily data $(date -u +%F)"
          git push

  deploy:
    needs: collect
    if: always() && (needs.collect.result == 'success' || needs.collect.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build page
        run: node build-site.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      # GitHub sometimes can't see the just-uploaded artifact yet; a short wait avoids that
      - run: sleep 30
      - id: deploy
        uses: actions/deploy-pages@v4
