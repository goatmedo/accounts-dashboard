<style>
  :root {
    --color-bg: #faf9f5; --color-fg: #1f1e1d; --color-fg-muted: #6b6a66; --color-panel: #ffffff; --color-border-line: #e5e3dc;
    --cds-text-secondary: #6b6a66; --cds-surface-popover: #ffffff; --cds-border: #e5e3dc; --cds-shadow-popover: 0 4px 16px rgba(0,0,0,.12);
    --cds-chart-grid: #ebe9e2; --cds-chart-axis: #c9c6bc; --cds-chart-muted: #d6d3ca;
    --cds-gap-xs: 4px; --cds-gap-sm: 8px; --cds-gap-md: 16px; --cds-gap-xl: 32px; --cds-pad-lg: 20px; --cds-radius: 12px;
    --cds-font-size-title: 2rem; --cds-font-size-heading: 1.15rem; --cds-font-size-body: 1rem; --cds-font-size-caption: .85rem; --cds-font-weight-medium: 600;

    --font-anthropic-serif: "Noto Naskh Arabic", "Traditional Arabic", Georgia, serif;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-bg: #1c1b1a; --color-fg: #f2f0ea; --color-fg-muted: #a3a19a; --color-panel: #262523; --color-border-line: #3a3936;
      --cds-text-secondary: #a3a19a; --cds-surface-popover: #2f2e2b; --cds-border: #3a3936; --cds-shadow-popover: 0 4px 16px rgba(0,0,0,.5);
      --cds-chart-grid: #34332f; --cds-chart-axis: #55534d; --cds-chart-muted: #4a4843;
    }
  }
  body { margin: 0; background: var(--color-bg); color: var(--color-fg); }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 20px 60px; }
</style>
